<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }
    .subtitle {
      color: #666;
      font-size: 12px;
      margin-bottom: 16px;
    }
    .config {
      margin-bottom: 12px;
    }
    .config label {
      font-size: 12px;
      color: #444;
      display: block;
      margin-bottom: 4px;
    }
    .config input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #captureBtn {
      background: #2563eb;
      color: white;
    }
    #captureBtn:hover { background: #1d4ed8; }
    #captureBtn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    #copyBtn {
      background: #f3f4f6;
      color: #374151;
    }
    #copyBtn:hover { background: #e5e7eb; }
    #analyzeBtn {
      background: #059669;
      color: white;
    }
    #analyzeBtn:hover { background: #047857; }
    #analyzeBtn:disabled {
      background: #6ee7b7;
      cursor: not-allowed;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      min-height: 18px;
    }
    .count { font-weight: 600; color: #2563eb; }
    .card {
      margin-top: 12px;
      border: 1px solid #d1fae5;
      border-radius: 8px;
      padding: 12px;
      background: #f0fdf4;
      display: none;
    }
    .card.visible { display: block; }
    .card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #059669;
      margin-top: 10px;
      margin-bottom: 2px;
    }
    .card-label:first-child { margin-top: 0; }
    .card-value {
      font-size: 12px;
      color: #1a1a1a;
      line-height: 1.4;
    }
    .card-saas {
      font-size: 13px;
      font-weight: 700;
      color: #047857;
    }
    .card-pitch {
      font-size: 11px;
      color: #374151;
      line-height: 1.5;
      margin-top: 6px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Pangolin</h1>

  <div class="config">
    <label for="apiUrl">API URL</label>
    <input id="apiUrl" type="text" placeholder="http://localhost:3939/api/listings" />
  </div>

  <div id="batchSection">
    <p class="subtitle">Capture Upwork listings from this page</p>
    <button id="captureBtn">Capture &amp; Send</button>
    <button id="copyBtn">Copy JSON to Clipboard</button>
  </div>

  <div id="analyzeSection" style="display:none">
    <p class="subtitle">Analyze this job for pain &amp; SaaS signals</p>
    <button id="analyzeBtn">Analyze this job</button>
  </div>

  <div id="status"></div>

  <div id="analysisCard" class="card">
    <div class="card-label">Pain</div>
    <div id="cardPain" class="card-value"></div>
    <div class="card-label">Root cause</div>
    <div id="cardRoot" class="card-value"></div>
    <div class="card-label">SaaS idea</div>
    <div id="cardPattern" class="card-value card-saas"></div>
    <div id="cardPitch" class="card-pitch"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
